<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Maintenance — VinAPIay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;color:#0f172a;background:#f0f7ff;background-image:radial-gradient(ellipse 800px 600px at 10% 0%,rgba(147,197,253,.5),transparent 60%),radial-gradient(ellipse 700px 500px at 90% 10%,rgba(196,181,253,.4),transparent 60%),radial-gradient(ellipse 900px 700px at 50% 100%,rgba(186,230,253,.5),transparent 60%);background-attachment:fixed;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{max-width:420px;text-align:center;background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.9);border-radius:24px;padding:40px 28px;box-shadow:0 8px 32px rgba(30,64,175,.1)}
.icon{font-size:72px;margin-bottom:16px;display:inline-block;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h1{font-size:26px;font-weight:800;letter-spacing:-.8px;background:linear-gradient(135deg,#0EA5E9,#6366F1);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:12px}
p{font-size:14px;color:#64748b;line-height:1.7;margin-bottom:8px}
.info{margin-top:20px;padding-top:20px;border-top:1px solid rgba(148,163,184,.15);font-size:12px;color:#94a3b8}
.reload{display:inline-block;margin-top:20px;padding:12px 24px;background:linear-gradient(135deg,#0EA5E9,#6366F1);color:#fff;text-decoration:none;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(14,165,233,.3)}
</style>
<script src="/theme-loader.js"></script>
</head>
<body>
<div class="box">
  <div class="icon">🔧</div>
  <h1>Sedang Maintenance</h1>
  <p>VinAPIay lagi di-update. Balik lagi dalam beberapa menit ya.</p>
  <p>Terima kasih atas kesabarannya 🙏</p>
  <a href="/" class="reload" onclick="location.reload();return false;">🔄 Coba Lagi</a>
  <div class="info">
    <div>Need help? <a href="https://t.me/JekyNobb" style="color:#0EA5E9;font-weight:700">@JekyNobb</a></div>
  </div>
</div>
<script>
// Auto-reload tiap 30 detik
setTimeout(function(){ location.reload(); }, 30000);
</script>
</body>
</html>
