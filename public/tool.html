<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Loading...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;max-width:100vw;overflow-x:hidden}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#0f172a;background:#f0f7ff;background-image:radial-gradient(ellipse 800px 600px at 10% 0%,rgba(147,197,253,.5),transparent 60%),radial-gradient(ellipse 700px 500px at 90% 10%,rgba(196,181,253,.4),transparent 60%),radial-gradient(ellipse 900px 700px at 50% 100%,rgba(186,230,253,.5),transparent 60%);background-attachment:fixed;min-height:100vh;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(148,163,184,.15);padding:14px 18px;display:flex;align-items:center;gap:12px}
header .back{color:#0f172a;text-decoration:none;background:rgba(255,255,255,.9);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid rgba(148,163,184,.25)}
header h1{font-size:16px;font-weight:800;flex:1;text-align:center;padding-right:60px;background:linear-gradient(135deg,#0EA5E9,#6366F1);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
.wrap{max-width:640px;margin:0 auto;padding:22px 16px 60px}
.hero{background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:22px;box-shadow:0 4px 24px rgba(30,64,175,.06);margin-bottom:18px}
.badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.1em;color:#0EA5E9;background:rgba(14,165,233,.1);padding:4px 10px;border-radius:6px;margin-bottom:10px;text-transform:uppercase}
.title{font-size:24px;font-weight:800;letter-spacing:-.6px;margin:0 0 8px;color:#0f172a;line-height:1.2}
.desc{color:#64748b;font-size:13px;line-height:1.6;margin:0}
.card{background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:22px;box-shadow:0 4px 24px rgba(30,64,175,.06);margin-bottom:16px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:700;color:#0f172a;margin-bottom:8px}
.field label small{font-weight:500;color:#94a3b8;font-size:11px}
.field input,.field textarea{width:100%;padding:14px 16px;background:#f8fafc;border:2px solid #e2e8f0;border-radius:14px;font-size:14px;font-family:inherit;color:#0f172a;outline:none;transition:all .2s}
.field input:focus,.field textarea:focus{border-color:#0EA5E9;background:#fff;box-shadow:0 0 0 4px rgba(14,165,233,.1)}
.field textarea{resize:vertical;min-height:100px;line-height:1.5}
.drop{border:2px dashed #cbd5e1;border-radius:18px;padding:30px 16px;text-align:center;cursor:pointer;background:#f8fafc;transition:all .2s}
.drop:hover,.drop.hover{border-color:#0EA5E9;background:rgba(14,165,233,.04)}
.drop-icon{width:56px;height:56px;margin:0 auto 12px;border-radius:16px;background:linear-gradient(135deg,rgba(14,165,233,.15),rgba(99,102,241,.15));display:flex;align-items:center;justify-content:center;font-size:26px}
.drop-text{font-size:14px;font-weight:700;color:#0f172a;margin-bottom:4px}
.drop-text b{color:#0EA5E9}
.drop-sub{font-size:12px;color:#94a3b8;line-height:1.5}
.drop input[type=file]{display:none}
.preview{margin-top:14px;display:none;position:relative}
.preview.show{display:block}
.preview img{width:100%;max-height:280px;object-fit:contain;border-radius:14px;background:#f8fafc;padding:6px;border:1px solid #e2e8f0}
.preview-clear{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:10px;background:rgba(220,38,38,.9);color:#fff;border:0;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}
.submit{width:100%;padding:16px;background:linear-gradient(135deg,#0EA5E9,#6366F1);color:#fff;border:0;border-radius:14px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 6px 20px rgba(14,165,233,.3);transition:all .2s;margin-top:8px}
.submit:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 10px 28px rgba(14,165,233,.45)}
.submit:disabled{opacity:.5;cursor:not-allowed;transform:none}
.alt-toggle{font-size:12px;color:#0EA5E9;font-weight:700;cursor:pointer;text-decoration:underline;background:none;border:0;font-family:inherit;padding:0;margin-bottom:10px;display:block}
.result-wrap{display:none;margin-top:8px}
.result-wrap.show{display:block}
.result-card{background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:22px;box-shadow:0 4px 24px rgba(30,64,175,.06)}
.result-title{font-size:13px;font-weight:800;color:#0EA5E9;text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px}
.result-media{width:100%;max-height:400px;border-radius:14px;display:block;background:#f8fafc}
.result-text{background:#f8fafc;border-radius:14px;padding:16px;font-size:14px;line-height:1.6;color:#334155;white-space:pre-wrap;word-break:break-word;max-height:500px;overflow:auto}
.result-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn-action{padding:11px 16px;background:#f1f5f9;border:1px solid #e2e8f0;color:#475569;border-radius:12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn-action.primary{background:linear-gradient(135deg,#0EA5E9,#6366F1);color:#fff;border:0}
.loading{text-align:center;padding:60px 16px;color:#94a3b8;font-size:14px;font-weight:600}
.loading-spin{width:36px;height:36px;margin:0 auto 12px;border:3px solid #e2e8f0;border-top-color:#0EA5E9;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;border-radius:14px;padding:16px;font-size:13px;line-height:1.5;font-weight:500}
.notfound{text-align:center;padding:60px 20px}
.notfound h2{font-size:22px;font-weight:800;margin:0 0 8px}
.notfound p{color:#64748b;font-size:14px;margin:0 0 20px}
.notfound a{display:inline-block;padding:12px 24px;background:linear-gradient(135deg,#0EA5E9,#6366F1);color:#fff;text-decoration:none;border-radius:14px;font-weight:700}
.chat-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;max-height:60vh;overflow-y:auto}
.chat-bubble{padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.6;max-width:85%;word-wrap:break-word;white-space:pre-wrap}
.chat-bubble.user{background:linear-gradient(135deg,#0EA5E9,#6366F1);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chat-bubble.ai{background:#f1f5f9;color:#334155;align-self:flex-start;border-bottom-left-radius:4px}
.chat-input-row{display:flex;gap:8px;align-items:flex-end}
.chat-input-row textarea{flex:1;padding:14px 16px;background:#f8fafc;border:2px solid #e2e8f0;border-radius:14px;font-size:14px;font-family:inherit;color:#0f172a;outline:none;resize:none;max-height:120px;min-height:52px;line-height:1.4}
.chat-input-row textarea:focus{border-color:#0EA5E9;background:#fff}
.chat-input-row button{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#0EA5E9,#6366F1);color:#fff;border:0;font-size:18px;cursor:pointer;flex-shrink:0;box-shadow:0 4px 12px rgba(14,165,233,.3)}
.chat-input-row button:disabled{opacity:.5}
@media(max-width:520px){.title{font-size:20px}.card,.hero,.result-card{padding:18px}.drop{padding:24px 12px}}
</style>
<script src="/theme-loader.js"></script>
<link rel="stylesheet" href="/native-feel.css?v=1">
</head>
<body>
<header>
  <a href="/" class="back">← Kembali</a>
  <h1 id="headerTitle">Loading...</h1>
</header>
<div class="wrap" id="wrap">
  <div class="loading"><div class="loading-spin"></div>Memuat tool...</div>
</div>
<script src="/tool-app.js?v=1"></script>
<script src="/update-banner.js?v=1" defer></script>
</body>
</html>
