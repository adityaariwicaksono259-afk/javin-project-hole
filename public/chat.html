<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<title>Chat — Javin Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme-global.css?v=1">
<link rel="stylesheet" href="/bottom-nav.css?v=2">
<link rel="stylesheet" href="/chat.css?v=1">
<script src="/theme-loader.js"></script>
</head>
<body class="chat-page">

<section class="chat-view" id="viewList">
  <header class="chat-header">
    <a href="/home" class="chat-hbtn" aria-label="Home"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></a>
    <h1 class="chat-title">Chat</h1>
    <button class="chat-hbtn" id="btnNewChat" aria-label="Chat Baru">+</button>
  </header>

  <div class="chat-search-wrap">
    <input type="text" id="chatSearch" class="chat-search" placeholder="Cari chat...">
  </div>

  <div class="chat-tabs" id="chatTabs">
    <button class="chat-tab active" data-tab="rooms">Chat</button>
    <button class="chat-tab" data-tab="contacts">Kontak</button>
  </div>

  <div class="chat-list" id="chatList"><div class="chat-loading">Memuat...</div></div>

  <div class="chat-empty" id="chatEmpty" hidden>
    <div class="chat-empty-emoji"><svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
    <div class="chat-empty-title">Belum ada chat</div>
    <div class="chat-empty-sub">Buka tab Kontak untuk mulai ngobrol</div>
  </div>
</section>

<section class="chat-view" id="viewRoom" hidden>
  <header class="chat-header room">
    <button class="chat-hbtn" id="btnBackList" aria-label="Kembali" data-no-back="1"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
    <div class="room-avatar" id="roomAvatar">U</div>
    <div class="room-meta">
      <div class="room-name" id="roomName">User</div>
      <div class="room-status" id="roomStatus">ketuk untuk info</div>
    </div>
    <button class="chat-hbtn" id="btnRoomMenu" aria-label="Menu">⋮</button>
  </header>

  <div class="chat-messages" id="chatMessages"></div>

  <form class="chat-inputbar" id="chatForm" autocomplete="off">
    <input type="text" id="chatInput" class="chat-input" placeholder="Ketik pesan..." maxlength="2000">
    <button type="submit" class="chat-send" id="btnSend" aria-label="Kirim">➤</button>
  </form>
</section>

<div class="chat-sheet" id="roomMenuSheet" hidden>
  <div class="chat-sheet-card">
    <div class="chat-sheet-title" id="sheetName">—</div>
    <button class="chat-sheet-item" id="btnBlock"><span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg></span> Blokir User</button>
    <button class="chat-sheet-item" id="btnClearChat"><span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span> Bersihkan Chat</button>
    <button class="chat-sheet-item" id="btnDisappear"><span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span> <span id="disappearLabel">Pesan Sementara</span></button>
    <div style="height:6px;border-top:1px dashed #CCC;margin:6px 4px"></div>
    <button class="chat-sheet-item danger" id="btnReport"><span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span> Laporkan User</button>
  </div>
</div>

<div class="chat-sheet report-sheet" id="reportSheet" hidden>
  <div class="chat-sheet-card">
    <button class="chat-sheet-close" id="reportClose"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <div class="chat-sheet-title">Laporkan User</div>
    <div class="chat-sheet-sub">Pilih alasan:</div>
    <div class="chat-reasons" id="reportReasons">
      <button class="chat-reason" data-r="Spam / Promosi">Spam / Promosi</button>
      <button class="chat-reason" data-r="Kata Kasar / Toxic">Kata Kasar / Toxic</button>
      <button class="chat-reason" data-r="Penipuan / Scam">Penipuan / Scam</button>
      <button class="chat-reason" data-r="Konten Tidak Pantas">Konten Tidak Pantas</button>
      <button class="chat-reason" data-r="Lainnya">Lainnya</button>
    </div>
    <input type="text" id="reportDetail" class="chat-input" placeholder="Detail tambahan (opsional)" style="margin-top:10px">
    <button class="chat-btn-primary" id="btnSendReport">Kirim Laporan</button>
  </div>
</div>


<!-- PROFIL USER MODAL -->
<div class="chat-profile-modal" id="profileModal" hidden>
  <div class="chat-profile-card">
    <button class="chat-profile-close" id="profileClose" aria-label="Tutup">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="chat-profile-avatar" id="profileAvatar">U</div>
    <div class="chat-profile-name" id="profileName">User</div>
    <div class="chat-profile-code" id="profileCode">-</div>
    <div class="chat-profile-section">
      <div class="chat-profile-label">BIO</div>
      <div class="chat-profile-bio" id="profileBio">Belum ada bio</div>
    </div>
    <div class="chat-profile-info">
      <div class="chat-profile-info-row">
        <span class="chat-profile-info-lbl">Status</span>
        <span class="chat-profile-info-val" id="profileStatus">-</span>
      </div>
      <div class="chat-profile-info-row">
        <span class="chat-profile-info-lbl">Bergabung</span>
        <span class="chat-profile-info-val" id="profileJoined">-</span>
      </div>
      <div class="chat-profile-info-row">
        <span class="chat-profile-info-lbl">Terakhir dilihat</span>
        <span class="chat-profile-info-val" id="profileLastSeen">-</span>
      </div>
    </div>
    <div class="chat-profile-actions" id="profileActions">
      <button class="chat-profile-btn danger" id="profileBtnBlock">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
        <span id="profileBlockLabel">Blokir</span>
      </button>
      <button class="chat-profile-btn" id="profileBtnReport">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Laporkan
      </button>
    </div>
  </div>
</div>

<script src="/chat.js?v=1"></script>
<script src="/bottom-nav.js?v=2"></script>
<script src="/back-handler.js?v=1"></script>
</body>
</html>
