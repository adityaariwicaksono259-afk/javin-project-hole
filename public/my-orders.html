<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Pesanan Saya — VinAPIay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style-v4.css">
<link rel="stylesheet" href="/native-v7.css">
<link rel="stylesheet" href="/buy.css">
<style>
.mo-tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.mo-tab{white-space:nowrap;padding:9px 16px;border-radius:999px;border:1px solid rgba(148,163,184,0.2);background:#fff;color:#64748b;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s}
.mo-tab.active{background:#0f172a;color:#fff;border-color:#0f172a}
.mo-tab small{opacity:.7}
.mo-list{display:flex;flex-direction:column;gap:10px}
.mo-card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;transition:.2s}
.mo-card:hover{border-color:#0EA5E9;transform:translateY(-1px);box-shadow:0 8px 24px rgba(14,165,233,0.08)}
.mo-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px}
.mo-code{font-family:monospace;font-size:12px;font-weight:800;color:#0f172a;background:#f1f5f9;padding:4px 10px;border-radius:8px;word-break:break-all}
.mo-status{font-size:10px;font-weight:800;padding:4px 10px;border-radius:8px;white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
.mo-status.waiting_payment{background:#fef3c7;color:#92400e}
.mo-status.pending_review{background:#dbeafe;color:#1e40af}
.mo-status.approved{background:#dcfce7;color:#166534}
.mo-status.rejected{background:#fee2e2;color:#991b1b}
.mo-row{display:flex;justify-content:space-between;padding:6px 0;font-size:12px;color:#64748b}
.mo-row b{color:#0f172a;font-weight:700}
.mo-price{color:#0EA5E9 !important;font-size:15px !important;font-weight:800 !important}
.mo-keys{margin-top:12px;padding-top:12px;border-top:1px dashed #e2e8f0}
.mo-keys-title{font-size:11px;color:#16a34a;font-weight:800;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.mo-key{display:flex;justify-content:space-between;align-items:center;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:10px 12px;margin-bottom:6px;gap:8px}
.mo-key code{font-size:13px;font-weight:800;color:#166534;font-family:monospace;letter-spacing:.5px}
.mo-key button{padding:6px 12px;background:#16a34a;color:#fff;border:0;border-radius:8px;font-size:10px;font-weight:800;cursor:pointer;font-family:inherit}
.mo-note{margin-top:10px;padding:10px 12px;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;font-size:11px;color:#991b1b;line-height:1.5}
.mo-empty{text-align:center;padding:60px 20px;color:#94a3b8}
.mo-empty-icon{font-size:56px;margin-bottom:12px;opacity:.5}
.mo-empty-title{font-size:15px;font-weight:700;color:#64748b;margin-bottom:6px}
.mo-empty-sub{font-size:12px;margin-bottom:20px}
.mo-empty a{display:inline-block;padding:12px 24px;background:linear-gradient(135deg,#0EA5E9,#6366F1);color:#fff;text-decoration:none;border-radius:12px;font-weight:700;font-size:13px;box-shadow:0 4px 14px rgba(14,165,233,.3)}
.mo-load{text-align:center;padding:50px 20px;color:#94a3b8;font-size:13px}
body.theme-dark .mo-card,body.theme-dark .mo-tab{background:rgba(30,41,59,.8);border-color:rgba(255,255,255,.08);color:#cbd5e1}
body.theme-dark .mo-code{background:rgba(15,23,42,.5);color:#f1f5f9}
body.theme-dark .mo-row b{color:#f1f5f9}
</style>
<script src="/theme-loader.js"></script>
<link rel="stylesheet" href="/native-feel.css?v=1">
<script src="/dialog.js?v=1"></script>
</head>
<body>

<header style="position:sticky;top:0;z-index:50;padding:10px 14px;background:rgba(255,255,255,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(148,163,184,0.15)">
  <div style="display:flex;align-items:center;gap:8px;width:100%">
    <a href="/buy" style="width:44px;height:44px;border-radius:14px;background:#fff;border:1px solid rgba(148,163,184,0.15);display:flex;align-items:center;justify-content:center;font-size:18px;text-decoration:none;color:#0f172a">←</a>
    <h1 style="flex:1;font-size:17px;font-weight:800;margin:0;padding-left:8px">Pesanan Saya</h1>
    <button onclick="loadOrders()" style="padding:8px 14px;background:#fff;border:1px solid rgba(148,163,184,0.15);border-radius:12px;font-size:12px;font-weight:700;color:#0f172a;cursor:pointer;font-family:inherit">🔄 Refresh</button>
  </div>
</header>

<div class="buy-wrap">
  <div class="mo-tabs" id="tabs">
    <button class="mo-tab active" data-filter="all">Semua</button>
    <button class="mo-tab" data-filter="waiting_payment">Belum Bayar</button>
    <button class="mo-tab" data-filter="pending_review">Diverifikasi</button>
    <button class="mo-tab" data-filter="approved">Berhasil</button>
    <button class="mo-tab" data-filter="rejected">Ditolak</button>
  </div>
  <div id="orderList" class="mo-list">
    <div class="mo-load">Memuat pesanan...</div>
  </div>
</div>

<script src="/my-orders.js?v=1"></script>
<script src="/update-banner.js?v=1" defer></script>
<script src="/announce.js?v=1" defer></script>
</body>
</html>
