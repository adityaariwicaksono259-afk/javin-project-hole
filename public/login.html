<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Login — Javin Tools</title>
<meta name="theme-color" content="#06111f">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#06111f;color:#e0f2fe;font-family:'Inter',system-ui,sans-serif;overflow-x:hidden}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 30%,rgba(34,211,238,.08),transparent 50%),radial-gradient(circle at 70% 70%,rgba(14,165,233,.06),transparent 50%),#06111f;padding:20px;min-height:100vh}
.card{width:100%;max-width:400px;background:#0a1929;border:1px solid rgba(34,211,238,.15);border-radius:20px;padding:36px 28px;text-align:center;animation:fadeUp .6s ease;box-shadow:0 20px 60px rgba(0,0,0,.5)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.logo{width:60px;height:60px;margin:0 auto 20px;border-radius:16px;background:linear-gradient(135deg,#0EA5E9,#22d3ee);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#06111f;letter-spacing:-1px;box-shadow:0 8px 24px rgba(34,211,238,.25)}
h1{font-size:19px;font-weight:700;color:#e0f2fe;margin-bottom:6px;letter-spacing:-.3px}
.subtitle{font-size:13px;color:#64748b;margin-bottom:26px;line-height:1.5}
.tabs{display:flex;gap:4px;background:rgba(34,211,238,.05);padding:4px;border-radius:10px;margin-bottom:20px}
.tab{flex:1;padding:9px 12px;border:0;background:transparent;color:#64748b;font-size:12px;font-weight:600;border-radius:7px;cursor:pointer;font-family:inherit;transition:all .2s}
.tab.active{background:#0a1929;color:#22d3ee;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.panel{display:none}
.panel.active{display:block}
.gbtn-wrap{display:flex;justify-content:center;margin-bottom:8px;min-height:44px}
.gbtn-wrap > div{width:100%!important}
.field{text-align:left;margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:600;color:#94a3b8;margin-bottom:6px;letter-spacing:.3px}
.field input{width:100%;padding:12px 14px;background:rgba(0,0,0,.3);border:1px solid rgba(34,211,238,.2);border-radius:10px;color:#e0f2fe;font-size:14px;font-family:inherit;outline:none;transition:all .2s}
.field input:focus{border-color:#22d3ee;box-shadow:0 0 0 3px rgba(34,211,238,.1)}
.field input::placeholder{color:#475569}
.btn-primary{width:100%;padding:13px;border:0;background:linear-gradient(135deg,#0EA5E9,#22d3ee);color:#06111f;font-size:14px;font-weight:700;border-radius:10px;cursor:pointer;font-family:inherit;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 16px rgba(34,211,238,.25)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(34,211,238,.35)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}
.footer{font-size:11px;color:#475569;line-height:1.6;margin-top:16px}
.loading{display:none;font-size:13px;color:#94a3b8;padding:16px 0}
.loading.show{display:block}
.error{display:none;font-size:12px;color:#f87171;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:10px 12px;margin-top:14px;line-height:1.5;text-align:left}
.error.show{display:block}
.success{display:none;font-size:12px;color:#22d3ee;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.2);border-radius:8px;padding:12px 14px;margin-top:14px;line-height:1.5;text-align:left}
.success.show{display:block}
.success b{color:#7dd3fc}
</style>
</head>
<body>
<div class="card">
  <div class="logo">J</div>
  <h1>Login untuk melanjutkan</h1>
  <div class="subtitle">Masuk ke Javin Tools dengan akun Google atau Email</div>

  <div class="tabs">
    <button class="tab active" data-tab="google">Google</button>
    <button class="tab" data-tab="email">Email</button>
  </div>

  <div class="panel active" id="panelGoogle">
    <div class="gbtn-wrap" id="gbtnWrap"></div>
  </div>

  <div class="panel" id="panelEmail">
    <div class="field">
      <label>Email</label>
      <input type="email" id="emailInput" placeholder="nama@email.com" autocomplete="email" inputmode="email">
    </div>
    <button class="btn-primary" id="btnSendEmail">Kirim Link Login</button>
    <div class="loading" id="loadingEmail">Mengirim link...</div>
    <div class="success" id="successEmail"></div>
  </div>

  <div class="error" id="error"></div>
  <div class="footer">Dengan masuk, Anda setuju dengan Syarat & Ketentuan</div>
</div>

<script>
var GOOGLE_CLIENT_ID = '924436722019-h93q5n13uumnudfcfe9o6ek0n5kikgkt.apps.googleusercontent.com';
var errorEl = document.getElementById('error');
var gbtnWrap = document.getElementById('gbtnWrap');

function showError(msg){
  errorEl.textContent = msg;
  errorEl.classList.add('show');
  setTimeout(function(){ errorEl.classList.remove('show'); }, 6000);
}

fetch('/api/auth/me', { credentials: 'same-origin' })
  .then(function(r){ return r.json(); })
  .then(function(j){
    if (j && j.ok && j.logged_in) {
      try {
        localStorage.setItem('javin_user_id', j.user.user_code);
        localStorage.setItem('javin_user_name', j.user.name || '');
        localStorage.setItem('javin_user_avatar', j.user.avatar || '');
      } catch(e){}
      location.replace('/');
    }
  })
  .catch(function(){});

document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){
    var target = t.dataset.tab;
    document.querySelectorAll('.tab').forEach(function(x){ x.classList.toggle('active', x === t); });
    document.getElementById('panelGoogle').classList.toggle('active', target === 'google');
    document.getElementById('panelEmail').classList.toggle('active', target === 'email');
    errorEl.classList.remove('show');
  });
});

window.addEventListener('load', function(){
  var s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.async = true; s.defer = true;
  s.onload = initGSI;
  s.onerror = function(){ showError('Gagal memuat Google Sign-In.'); };
  document.head.appendChild(s);
});

function initGSI(){
  if (!window.google || !google.accounts) {
    showError('Google Sign-In tidak tersedia.');
    return;
  }
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredential,
    auto_select: false,
    cancel_on_tap_outside: true
  });
  google.accounts.id.renderButton(gbtnWrap, {
    theme: 'filled_black',
    size: 'large',
    text: 'continue_with',
    shape: 'pill',
    logo_alignment: 'left',
    width: 300
  });
}

async function handleCredential(response){
  if (!response || !response.credential) {
    showError('Login dibatalkan.');
    return;
  }
  gbtnWrap.style.display = 'none';
  try {
    var r = await fetch('/api/auth/google', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id_token: response.credential })
    });
    var j = await r.json();
    if (!j.ok) {
      gbtnWrap.style.display = 'block';
      showError('Login gagal: ' + (j.message || 'unknown'));
      return;
    }
    try {
      localStorage.setItem('javin_user_id', j.user.user_code);
      localStorage.setItem('javin_user_name', j.user.name || '');
      localStorage.setItem('javin_user_avatar', j.user.avatar || '');
    } catch(e){}
    setTimeout(function(){ location.replace('/'); }, 400);
  } catch (e) {
    gbtnWrap.style.display = 'block';
    showError('Koneksi gagal. Coba lagi.');
  }
}

var emailInput = document.getElementById('emailInput');
var btnSend = document.getElementById('btnSendEmail');
var loadingEmail = document.getElementById('loadingEmail');
var successEmail = document.getElementById('successEmail');

btnSend.addEventListener('click', sendMagicLink);
emailInput.addEventListener('keydown', function(e){
  if (e.key === 'Enter') sendMagicLink();
});

async function sendMagicLink(){
  var email = (emailInput.value || '').trim().toLowerCase();
  if (!email || email.indexOf('@') === -1) {
    showError('Masukkan email yang valid.');
    return;
  }
  errorEl.classList.remove('show');
  successEmail.classList.remove('show');
  btnSend.disabled = true;
  loadingEmail.classList.add('show');

  try {
    var r = await fetch('/api/auth/email/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    });
    var j = await r.json();
    loadingEmail.classList.remove('show');
    btnSend.disabled = false;

    if (!j.ok) {
      showError(j.message || 'Gagal kirim link.');
      return;
    }

    successEmail.innerHTML = '<b>Link terkirim!</b><br>Cek inbox <b>' + email + '</b> dan klik link untuk masuk. Link berlaku 15 menit.';
    successEmail.classList.add('show');
    emailInput.value = '';
  } catch (e) {
    loadingEmail.classList.remove('show');
    btnSend.disabled = false;
    showError('Koneksi gagal. Coba lagi.');
  }
}
</script>
</body>
</html>
