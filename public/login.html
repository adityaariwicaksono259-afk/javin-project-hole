<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Login — Javin Tools</title>
<meta name="theme-color" content="#06111f">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#06111f;color:#e0f2fe;font-family:'Inter',system-ui,sans-serif;overflow-x:hidden}
body{
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 30%,rgba(34,211,238,.08),transparent 50%),
             radial-gradient(circle at 70% 70%,rgba(14,165,233,.06),transparent 50%),
             #06111f;
  padding:20px;min-height:100vh;
}
.card{
  width:100%;max-width:400px;
  background:#0a1929;
  border:1px solid rgba(34,211,238,.15);
  border-radius:20px;
  padding:40px 28px;
  text-align:center;
  animation:fadeUp .6s ease;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.logo{
  width:64px;height:64px;margin:0 auto 24px;border-radius:18px;
  background:linear-gradient(135deg,#0EA5E9,#22d3ee);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:800;color:#06111f;letter-spacing:-1px;
  box-shadow:0 8px 24px rgba(34,211,238,.3);
}
h1{font-size:20px;font-weight:700;color:#e0f2fe;margin-bottom:8px;letter-spacing:-.3px}
.subtitle{font-size:13px;color:#64748b;margin-bottom:28px;line-height:1.5}
.field{text-align:left;margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:600;color:#94a3b8;margin-bottom:8px;letter-spacing:.3px;text-transform:uppercase}
.field input{
  width:100%;padding:14px 16px;
  background:rgba(0,0,0,.3);
  border:1px solid rgba(34,211,238,.2);
  border-radius:12px;
  color:#e0f2fe;font-size:15px;font-family:inherit;
  outline:none;transition:all .2s;
}
.field input:focus{border-color:#22d3ee;box-shadow:0 0 0 3px rgba(34,211,238,.1)}
.field input::placeholder{color:#475569}
.btn-primary{
  width:100%;padding:14px;border:0;margin-top:6px;
  background:linear-gradient(135deg,#0EA5E9,#22d3ee);
  color:#06111f;font-size:14px;font-weight:700;
  border-radius:12px;cursor:pointer;font-family:inherit;
  transition:transform .15s,box-shadow .15s;
  box-shadow:0 4px 16px rgba(34,211,238,.25);
  letter-spacing:.2px;
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(34,211,238,.35)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}
.footer{font-size:11px;color:#475569;line-height:1.6;margin-top:20px}
.loading{display:none;font-size:13px;color:#94a3b8;padding:16px 0}
.loading.show{display:block}
.error{
  display:none;font-size:12px;color:#f87171;
  background:rgba(239,68,68,.08);
  border:1px solid rgba(239,68,68,.2);
  border-radius:10px;padding:12px 14px;margin-top:16px;line-height:1.5;text-align:left;
}
.error.show{display:block}
.success{
  display:none;font-size:13px;color:#22d3ee;
  background:rgba(34,211,238,.08);
  border:1px solid rgba(34,211,238,.25);
  border-radius:10px;padding:14px 16px;margin-top:16px;line-height:1.6;text-align:left;
}
.success.show{display:block}
.success b{color:#7dd3fc;display:block;margin-bottom:4px;font-size:14px}
.success .hint{color:#94a3b8;font-size:12px;margin-top:6px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">J</div>
  <h1>Login untuk melanjutkan</h1>
  <div class="subtitle">Masuk dengan email — kami akan kirim link login ke inbox Anda</div>

  <div class="field">
    <label>Email</label>
    <input type="email" id="emailInput" placeholder="nama@email.com" autocomplete="email" inputmode="email" autofocus>
  </div>
  <button class="btn-primary" id="btnSendEmail">Kirim Link Login</button>

  <div class="loading" id="loadingEmail">Mengirim link...</div>
  <div class="success" id="successEmail"></div>
  <div class="error" id="error"></div>

  <div class="footer">Link berlaku 15 menit. Cek folder spam kalau tidak masuk.</div>
</div>

<script>
var errorEl = document.getElementById('error');
var successEl = document.getElementById('successEmail');
var loadingEl = document.getElementById('loadingEmail');
var emailInput = document.getElementById('emailInput');
var btnSend = document.getElementById('btnSendEmail');

function showError(msg){
  successEl.classList.remove('show');
  errorEl.textContent = msg;
  errorEl.classList.add('show');
}

// Kalau udah login → langsung masuk
fetch('/api/auth/me', { credentials: 'same-origin' })
  .then(function(r){ return r.json(); })
  .then(function(j){
    if (j && j.ok && j.logged_in) {
      try {
        localStorage.setItem('javin_user_id', j.user.user_code);
        localStorage.setItem('javin_user_name', j.user.name || '');
        localStorage.setItem('javin_user_avatar', j.user.avatar || '');
      } catch(e){}
      location.replace('/');
    }
  })
  .catch(function(){});

btnSend.addEventListener('click', sendMagicLink);
emailInput.addEventListener('keydown', function(e){
  if (e.key === 'Enter') sendMagicLink();
});

async function sendMagicLink(){
  var email = (emailInput.value || '').trim().toLowerCase();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showError('Masukkan email yang valid.');
    return;
  }
  errorEl.classList.remove('show');
  successEl.classList.remove('show');
  btnSend.disabled = true;
  loadingEl.classList.add('show');

  try {
    var r = await fetch('/api/auth/email/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    });
    var j = await r.json();
    loadingEl.classList.remove('show');
    btnSend.disabled = false;

    if (!j.ok) {
      showError(j.message || 'Gagal kirim link. Coba lagi.');
      return;
    }

    successEl.innerHTML = '<b>Link terkirim!</b>Cek inbox <b style="display:inline">' + email + '</b><div class="hint">Klik link di email untuk masuk. Cek folder <b style="display:inline">Spam</b> kalau tidak muncul dalam 1 menit.</div>';
    successEl.classList.add('show');
    emailInput.value = '';
  } catch (e) {
    loadingEl.classList.remove('show');
    btnSend.disabled = false;
    showError('Koneksi gagal. Coba lagi.');
  }
}
</script>
</body>
</html>
