<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Admin Panel - JAVIN</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Space Grotesk',sans-serif;background:#03030a;color:#eee;min-height:100vh}
header{position:sticky;top:0;z-index:10;background:rgba(10,10,16,.9);backdrop-filter:blur(14px);padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08)}
.back{color:#fff;text-decoration:none;background:rgba(255,255,255,.1);padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600}
h1{font-family:'Orbitron',sans-serif;font-size:16px;flex:1;text-align:center;padding-right:60px}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.tab{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#aaa;padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.tab.active{background:linear-gradient(180deg,rgba(112,69,255,.3),rgba(112,69,255,.1));color:#fff;border-color:rgba(169,140,255,.5)}
.pane{display:none}
.pane.active{display:block}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:140px;padding:10px 12px;background:#09090e;border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:10px;font-size:13px;outline:none}
.toolbar button{padding:10px 16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:10px;font-weight:600;font-size:12px;cursor:pointer}
.toolbar button.primary{background:linear-gradient(90deg,#7045ff,#a05cff);border:0}
table{width:100%;border-collapse:collapse;font-size:12px;background:rgba(0,0,0,.3);border-radius:12px;overflow:hidden;min-width:520px}
.table-wrap{overflow-x:auto;border-radius:12px;margin-bottom:8px}
@media(max-width:520px){
  .wrap{padding:12px}
  header h1{font-size:13px;padding-right:0}
  .back{font-size:11px;padding:6px 10px}
  .tab{padding:8px 12px;font-size:11px}
  th,td{padding:8px 6px;font-size:10px}
  .form-box input{width:100%;margin-right:0}
  .toolbar button{padding:8px 12px;font-size:11px}
  code{font-size:9px;padding:2px 5px}
  .btn-sm{padding:4px 8px;font-size:10px}
}
th{background:rgba(112,69,255,.15);color:#c7b9ff;text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase}
td{padding:10px 12px;border-top:1px solid rgba(255,255,255,.06);color:#ddd}
code{background:rgba(0,0,0,.5);padding:3px 7px;border-radius:6px;color:#a9c9ff;font-size:11px}
.btn-sm{padding:5px 10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:6px;font-size:11px;cursor:pointer;margin-right:4px;font-weight:600}
.btn-sm:hover{background:rgba(112,69,255,.35)}
.btn-sm.danger{background:rgba(255,77,109,.15);border-color:rgba(255,77,109,.4);color:#ffb4bd}
.form-box{margin-top:16px;padding:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px}
.form-box h4{margin-bottom:12px;font-size:12px;color:#a98cff;text-transform:uppercase;letter-spacing:.1em}
.form-box input{width:calc(50% - 8px);margin:0 8px 8px 0;padding:10px 12px;background:#09090e;border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:10px;font-size:13px;outline:none}
.form-box button{padding:10px 20px;background:linear-gradient(90deg,#7045ff,#a05cff);border:0;color:#fff;border-radius:10px;font-weight:700;cursor:pointer}
.result{margin-top:12px;padding:12px;border-radius:10px;font-size:12px;display:none;white-space:pre-wrap}
.result.show{display:block}
.result.ok{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);color:#4ade80}
.result.err{background:rgba(255,77,109,.1);border:1px solid rgba(255,77,109,.3);color:#ff9aad}
.empty{text-align:center;color:#666;padding:20px;font-style:italic}
.loading{text-align:center;color:#888;padding:40px;font-size:14px}

/* === Fix layout kepotong === */
html,body{max-width:100vw;overflow-x:hidden}
.wrap{max-width:1100px;margin:0 auto;padding:20px;width:100%}
.tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tabs::-webkit-scrollbar{height:6px}
.tabs::-webkit-scrollbar-thumb{background:rgba(169,140,255,.4);border-radius:3px}
.tab{flex-shrink:0}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;margin-bottom:14px;max-width:100%}
.table-wrap::-webkit-scrollbar{height:8px}
.table-wrap::-webkit-scrollbar-thumb{background:rgba(169,140,255,.5);border-radius:4px}
table{min-width:600px}
.form-box input{width:100%;margin:0 0 8px 0;display:block}
.form-box button{width:100%;margin-top:4px}
@media(max-width:520px){
  .wrap{padding:12px 10px}
  header{padding:10px 12px}
  header h1{font-size:12px;letter-spacing:1px}
  .back{font-size:11px;padding:6px 10px}
  .tab{padding:8px 12px;font-size:11px}
  .toolbar{flex-direction:column}
  .toolbar input,.toolbar button{width:100%}
  th,td{padding:8px 6px;font-size:10px;white-space:nowrap}
  .btn-sm{padding:4px 8px;font-size:10px;margin:2px 2px 2px 0}
  table{min-width:500px}
}
</style>
</head>
<body>
<header>
  <a href="/" class="back">← Beranda</a>
  <h1>ADMIN PANEL</h1>
</header>
<div class="wrap">
  <div id="loading" class="loading">🔐 Memverifikasi session...</div>
  <div id="content" style="display:none">
    <div class="tabs">
      <button class="tab active" data-tab="users">User & Limit</button>
      <button class="tab" data-tab="logs">Log</button>
      <button class="tab" data-tab="config">Config</button>
      <button class="tab" data-tab="keys">Premium Keys</button>
      <button class="tab" data-tab="backup">Backup</button>
    </div>

    <div class="pane active" data-pane="users">
      <div class="toolbar">
        <input id="userSearch" placeholder="Cari user ID...">
        <button onclick="loadUsers()">Refresh</button>
      </div>
      <div class="table-wrap"><table><thead><tr><th>User ID</th><th>Limit</th><th>Hari ini</th><th>Total</th><th>Last Seen</th><th>Aksi</th></tr></thead><tbody id="userTbody"></tbody></table></div>
      <div class="form-box">
        <h4>Set Limit User</h4>
        <input id="adminUserId" placeholder="User ID (JH-...)">
        <input id="adminExtraLimit" type="number" min="1" max="15" placeholder="Limit (1-15)">
        <button onclick="setLimit()">Simpan</button>
      </div>
    </div>

    <div class="pane" data-pane="logs">
      <div class="toolbar">
        <input id="logFilterUid" placeholder="Filter user ID">
        <button onclick="loadLogs()">Refresh</button>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Waktu</th><th>User</th><th>Endpoint</th><th>Status</th></tr></thead><tbody id="logTbody"></tbody></table></div>
    </div>

    <div class="pane" data-pane="config">
      <div class="toolbar"><button onclick="loadConfig()">Refresh</button></div>
      <div class="table-wrap"><table><thead><tr><th>Key</th><th>Value</th><th>Updated</th></tr></thead><tbody id="configTbody"></tbody></table></div>
      <div class="form-box">
        <h4>Set Config</h4>
        <input id="configKey" placeholder="Key">
        <input id="configValue" placeholder="Value">
        <button onclick="saveConfig()">Simpan</button>
      </div>
    </div>

    <div class="pane" data-pane="keys">
      <div class="toolbar">
        <input id="keysSearch" placeholder="Cari key...">
        <button onclick="loadKeys()">Refresh</button>
      </div>
      <div class="form-box">
        <h4>Generate Key Baru</h4>
        <input id="newKeyLabel" placeholder="Nama Pemilik">
        <input id="newKeyMax" type="number" min="1" max="100" value="5" placeholder="Kuota">
        <button onclick="genKey()">🎲 Generate</button>
        <div id="genKeyResult" class="result"></div>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Key</th><th>Label</th><th>Owner</th><th>Kuota</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="keysTbody"></tbody></table></div>
    </div>

    <div class="pane" data-pane="backup">
      <div class="toolbar">
        <button onclick="loadBackupInfo()">Refresh Info</button>
        <button class="primary" onclick="runBackup()">📦 Backup Sekarang</button>
      </div>
      <div id="backupInfo" style="background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:16px;margin-bottom:14px;font-size:12px;color:#ccc"></div>
      <div id="backupResult" class="result"></div>
    </div>
  </div>
</div>

<script>
var $ = function(id){ return document.getElementById(id) };

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtTime(ts){ if(!ts) return '-'; var d=new Date(Number(ts)); if(isNaN(d.getTime())) return '-'; return d.toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }

// ==== INIT: cek fresh login (URL param ATAU sessionStorage) ====
(function(){
  var urlParams = new URLSearchParams(window.location.search);
  var urlFresh = urlParams.get('fresh') === '1';
  var ssFresh = false;
  try { ssFresh = !!sessionStorage.getItem('admin_fresh_login'); } catch(e) {}

  var freshFlag = urlFresh || ssFresh;

  // Bersihin flag
  try { sessionStorage.removeItem('admin_fresh_login'); } catch(e) {}
  try {
    var url = new URL(window.location.href);
    if (url.searchParams.has('fresh')) {
      url.searchParams.delete('fresh');
      window.history.replaceState({}, '', url.toString());
    }
  } catch(e) {}

  if (!freshFlag) {
    $('loading').innerHTML = '<div style="color:#ff9aad">🔒 Harus login dulu.<br><br>Redirect ke beranda...</div>';
    setTimeout(function(){ window.location.href = '/'; }, 1200);
    return;
  }

  // Cek session server juga
  fetch('/api/admin/check', { credentials: 'same-origin' })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (j && j.ok) {
        $('loading').style.display = 'none';
        $('content').style.display = 'block';
        loadUsers();
      } else {
        $('loading').innerHTML = '<div style="color:#ff9aad">❌ Session tidak valid.<br><br><a href="/" style="color:#a98cff">← Login ulang</a></div>';
      }
    })
    .catch(function(e){
      $('loading').innerHTML = '<div style="color:#ff9aad">Error: ' + esc(e.message) + '</div>';
    });
})();

// ==== TABS ====
document.querySelectorAll('.tab').forEach(function(t){
  t.onclick = function(){
    document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
    document.querySelectorAll('.pane').forEach(function(x){ x.classList.remove('active'); });
    t.classList.add('active');
    var pane = document.querySelector('.pane[data-pane="' + t.dataset.tab + '"]');
    if (pane) pane.classList.add('active');
    if (t.dataset.tab === 'users') loadUsers();
    if (t.dataset.tab === 'logs') loadLogs();
    if (t.dataset.tab === 'config') loadConfig();
    if (t.dataset.tab === 'keys') loadKeys();
    if (t.dataset.tab === 'backup') loadBackupInfo();
  };
});

// ==== USERS ====
async function loadUsers(){
  var tb = $('userTbody');
  tb.innerHTML = '<tr><td colspan="6" class="empty">Loading...</td></tr>';
  try {
    var r = await fetch('/api/admin/users');
    if (r.status === 401) { tb.innerHTML = '<tr><td colspan="6" class="empty">🔒 Session habis. Login ulang.</td></tr>'; return; }
    var j = await r.json();
    if (!j.ok) { tb.innerHTML = '<tr><td colspan="6" class="empty">' + esc(j.message) + '</td></tr>'; return; }
    var filter = ($('userSearch').value || '').toLowerCase();
    var list = (j.users || []).filter(function(u){ return !filter || u.id.toLowerCase().indexOf(filter) !== -1; });
    if (!list.length) { tb.innerHTML = '<tr><td colspan="6" class="empty">Belum ada user.</td></tr>'; return; }
    tb.innerHTML = list.map(function(u){
      return '<tr><td><code>' + esc(u.id) + '</code></td><td>' + u.extra_limit + '</td><td>' + u.today + '</td><td>' + u.total_request + '</td><td>' + fmtTime(u.last_seen) + '</td><td><button class="btn-sm danger" onclick="delUser(\'' + esc(u.id) + '\')">Hapus</button></td></tr>';
    }).join('');
  } catch(e) { tb.innerHTML = '<tr><td colspan="6" class="empty">Error: ' + esc(e.message) + '</td></tr>'; }
}

async function setLimit(){
  var uid = $('adminUserId').value.trim();
  var limit = parseInt($('adminExtraLimit').value);
  if (!uid || isNaN(limit) || limit < 1 || limit > 15) { alert('Isi User ID + limit 1-15'); return; }
  var r = await fetch('/api/admin/users', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ id: uid, extra_limit: limit }) });
  var j = await r.json();
  alert(j.message || 'OK');
  if (j.ok) loadUsers();
}

async function delUser(id){
  if (!confirm('Hapus user ' + id + '?')) return;
  var r = await fetch('/api/admin/users?id=' + encodeURIComponent(id), { method: 'DELETE' });
  var j = await r.json();
  alert(j.message || 'OK');
  loadUsers();
}

$('userSearch').oninput = loadUsers;

// ==== LOGS ====
async function loadLogs(){
  var tb = $('logTbody');
  tb.innerHTML = '<tr><td colspan="4" class="empty">Loading...</td></tr>';
  try {
    var uid = ($('logFilterUid').value || '').trim();
    var url = '/api/admin/logs?limit=200' + (uid ? '&uid=' + encodeURIComponent(uid) : '');
    var r = await fetch(url);
    var j = await r.json();
    if (!j.ok) { tb.innerHTML = '<tr><td colspan="4" class="empty">' + esc(j.message) + '</td></tr>'; return; }
    var list = j.logs || [];
    if (!list.length) { tb.innerHTML = '<tr><td colspan="4" class="empty">Belum ada log.</td></tr>'; return; }
    tb.innerHTML = list.map(function(l){
      var color = l.status >= 200 && l.status < 300 ? '#4ade80' : (l.status >= 400 ? '#f87171' : '#fbbf24');
      return '<tr><td>' + fmtTime(l.created_at) + '</td><td><code>' + esc(l.user_id) + '</code></td><td>' + esc(l.endpoint_id) + '</td><td style="color:' + color + '">' + l.status + '</td></tr>';
    }).join('');
  } catch(e) { tb.innerHTML = '<tr><td colspan="4" class="empty">Error: ' + esc(e.message) + '</td></tr>'; }
}
$('logFilterUid').oninput = loadLogs;

// ==== CONFIG ====
async function loadConfig(){
  var tb = $('configTbody');
  tb.innerHTML = '<tr><td colspan="3" class="empty">Loading...</td></tr>';
  var r = await fetch('/api/admin/config');
  var j = await r.json();
  if (!j.ok) { tb.innerHTML = '<tr><td colspan="3" class="empty">' + esc(j.message) + '</td></tr>'; return; }
  var list = j.config || [];
  if (!list.length) { tb.innerHTML = '<tr><td colspan="3" class="empty">Belum ada config.</td></tr>'; return; }
  tb.innerHTML = list.map(function(c){ return '<tr><td><code>' + esc(c.key) + '</code></td><td>' + esc(c.value) + '</td><td>' + fmtTime(c.updated_at) + '</td></tr>'; }).join('');
}

async function saveConfig(){
  var key = $('configKey').value.trim();
  var value = $('configValue').value;
  if (!key) { alert('Key wajib'); return; }
  var r = await fetch('/api/admin/config', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ key: key, value: value }) });
  var j = await r.json();
  alert(j.message || 'OK');
  if (j.ok) loadConfig();
}

// ==== KEYS ====
async function loadKeys(){
  var tb = $('keysTbody');
  tb.innerHTML = '<tr><td colspan="6" class="empty">Loading...</td></tr>';
  var r = await fetch('/api/admin/premium-keys');
  var j = await r.json();
  if (!j.ok) { tb.innerHTML = '<tr><td colspan="6" class="empty">' + esc(j.message) + '</td></tr>'; return; }
  var list = j.keys || [];
  if (!list.length) { tb.innerHTML = '<tr><td colspan="6" class="empty">Belum ada key.</td></tr>'; return; }
  tb.innerHTML = list.map(function(k){
    var statusColor = k.status === 'active' ? '#4ade80' : (k.status === 'exhausted' ? '#fbbf24' : '#f87171');
    return '<tr><td><code style="color:#a98cff">' + esc(k.key) + '</code></td><td>' + esc(k.label) + '</td><td>' + (k.owner_id ? '<code>' + esc(k.owner_id) + '</code>' : '<span style="color:#666">-</span>') + '</td><td>' + k.used_count + '/' + k.max_uses + '</td><td style="color:' + statusColor + '">' + esc(k.status) + '</td><td><button class="btn-sm" onclick="copyKey(\'' + esc(k.key) + '\')">Copy</button></td></tr>';
  }).join('');
}

function copyKey(k){
  if (navigator.clipboard) navigator.clipboard.writeText(k).then(function(){ alert('✅ Copy: ' + k); });
  else prompt('Copy:', k);
}

async function genKey(){
  var label = $('newKeyLabel').value.trim() || 'Tanpa label';
  var max = parseInt($('newKeyMax').value) || 5;
  if (max < 1 || max > 100) { alert('Kuota 1-100'); return; }
  var res = $('genKeyResult');
  res.className = 'result show'; res.textContent = 'Generating...';
  var r = await fetch('/api/admin/premium-keys', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ label: label, max_uses: max, quantity: 1 }) });
  var j = await r.json();
  if (j.ok && j.keys && j.keys[0]) {
    res.className = 'result show ok';
    res.textContent = '✅ Key: ' + j.keys[0] + '\nPemilik: ' + label + '\nKuota: ' + max;
    if (navigator.clipboard) navigator.clipboard.writeText(j.keys[0]);
    loadKeys();
  } else {
    res.className = 'result show err';
    res.textContent = '❌ ' + (j.message || 'Gagal');
  }
}

// ==== BACKUP ====
async function loadBackupInfo(){
  var info = $('backupInfo');
  info.innerHTML = '<div style="color:#888">Loading...</div>';
  var r = await fetch('/api/admin/backup');
  var j = await r.json();
  if (!j.ok) { info.innerHTML = '<div style="color:#ff9aad">' + esc(j.message) + '</div>'; return; }
  var rows = Object.entries(j.summary || {}).map(function(kv){
    return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)"><span style="color:#a98cff">' + kv[0] + '</span><span style="color:#fff;font-weight:700">' + kv[1] + ' rows</span></div>';
  }).join('');
  info.innerHTML = '<div style="font-weight:700;color:#a98cff;margin-bottom:8px">📊 Isi Database</div>' + rows;
}

async function runBackup(){
  if (!confirm('Backup sekarang? File dikirim ke Telegram.')) return;
  var res = $('backupResult');
  res.className = 'result show'; res.textContent = 'Membuat backup...';
  var r = await fetch('/api/admin/backup', { method: 'POST' });
  var j = await r.json();
  if (j.ok) {
    var tgMsg = j.telegram && j.telegram.ok ? '✅ Terkirim ke Telegram' : '⚠️ Gagal: ' + (j.telegram && j.telegram.reason);
    res.className = 'result show ok';
    res.textContent = '✅ Backup berhasil!\n\n📄 ' + j.filename + '\n📊 ' + j.total_rows + ' rows\n📦 ' + (j.size_bytes/1024).toFixed(1) + ' KB\n' + tgMsg;
  } else {
    res.className = 'result show err';
    res.textContent = '❌ ' + (j.message || 'Gagal');
  }
}
</script>
</body>
</html>
