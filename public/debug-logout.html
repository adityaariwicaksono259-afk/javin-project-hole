<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Debug Logout</title>
<style>
body{font-family:monospace;padding:16px;background:#111;color:#0f0;font-size:13px;line-height:1.6}
.ok{color:#0f0}
.err{color:#f00}
.warn{color:#ff0}
h2{color:#fff;font-size:16px;margin:16px 0 8px}
pre{background:#222;padding:8px;border-radius:6px;overflow-x:auto;white-space:pre-wrap;word-break:break-all}
button{background:#0f0;color:#000;border:0;padding:8px 16px;font-weight:700;margin:4px 0;cursor:pointer;border-radius:6px}
</style>
</head>
<body>
<h2>1. Cek Element</h2>
<pre id="r1">Loading...</pre>

<h2>2. Cek Fungsi Global</h2>
<pre id="r2">Loading...</pre>

<h2>3. Test Click Manual</h2>
<button id="t1">Test __jvShowLogout()</button>
<button id="t2">Test .click() pfLogout</button>

<h2>4. Console Error Log</h2>
<pre id="r4">Belum ada error</pre>

<h2>5. Struktur #logoutModal</h2>
<pre id="r5">Loading...</pre>

<script>
window.__errLog = [];
window.addEventListener('error', function(e) {
  window.__errLog.push('[ERROR] ' + e.message + ' @ ' + e.filename + ':' + e.lineno);
  document.getElementById('r4').textContent = window.__errLog.join('\n');
});

function run() {
  // 1. Cek element
  var el1 = document.getElementById('profileModal');
  var el2 = document.getElementById('logoutModal');
  var el3 = document.getElementById('pfLogout');
  var el4 = document.getElementById('lcConfirm');
  var el5 = document.getElementById('lcCancel');
  
  var r1 = '';
  r1 += (el1 ? '✅' : '❌') + ' #profileModal\n';
  r1 += (el2 ? '✅' : '❌') + ' #logoutModal\n';
  r1 += (el3 ? '✅' : '❌') + ' #pfLogout\n';
  r1 += (el4 ? '✅' : '❌') + ' #lcConfirm\n';
  r1 += (el5 ? '✅' : '❌') + ' #lcCancel\n';
  
  if (el2) {
    r1 += '\n#logoutModal computed style:\n';
    var cs = getComputedStyle(el2);
    r1 += '  display: ' + cs.display + '\n';
    r1 += '  visibility: ' + cs.visibility + '\n';
    r1 += '  opacity: ' + cs.opacity + '\n';
    r1 += '  z-index: ' + cs.zIndex + '\n';
    r1 += '  pointer-events: ' + cs.pointerEvents + '\n';
    r1 += '  style.display: "' + el2.style.display + '"\n';
  }
  document.getElementById('r1').textContent = r1;

  // 2. Cek fungsi global
  var r2 = '';
  r2 += (typeof window.__jvShowLogout === 'function' ? '✅' : '❌') + ' window.__jvShowLogout\n';
  r2 += (typeof window.__jvCancelLogout === 'function' ? '✅' : '❌') + ' window.__jvCancelLogout\n';
  r2 += (typeof window.__jvDoLogout === 'function' ? '✅' : '❌') + ' window.__jvDoLogout\n';
  document.getElementById('r2').textContent = r2;

  // 5. Struktur logoutModal
  if (el2) {
    var r5 = el2.outerHTML.slice(0, 800);
    document.getElementById('r5').textContent = r5;
  }

  // Test clicks
  document.getElementById('t1').onclick = function() {
    try {
      if (typeof window.__jvShowLogout === 'function') {
        window.__jvShowLogout();
        alert('__jvShowLogout() jalan!\nCek apakah modal muncul.');
      } else {
        alert('❌ __jvShowLogout TIDAK ADA');
      }
    } catch(e) {
      alert('ERROR: ' + e.message);
    }
  };

  document.getElementById('t2').onclick = function() {
    try {
      if (el3) {
        el3.click();
        alert('pfLogout.click() jalan!\nCek apakah modal muncul.');
      } else {
        alert('❌ #pfLogout tidak ada');
      }
    } catch(e) {
      alert('ERROR: ' + e.message);
    }
  };
}

// Jalanin setelah delay biar app.js selesai load
setTimeout(run, 1500);
</script>
</body>
</html>
