<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Cari Tool — Javin Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style-neobrutalism.css?v=10">
<link rel="stylesheet" href="/bottom-nav.css?v=3">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#FFE600;font-family:'Space Grotesk',system-ui,sans-serif;color:#0A0A0A;overflow-x:hidden}
body{padding-bottom:110px}

/* Header */
.search-header{position:sticky;top:0;z-index:50;background:#FFE600;padding:14px 16px;border-bottom:3px solid #0A0A0A;box-shadow:0 4px 0 #0A0A0A}
.search-title{font-family:'Archivo Black',sans-serif;font-size:18px;margin:0 0 10px;letter-spacing:0.5px}
.search-bar{position:relative;display:flex;align-items:center}
.search-input{width:100%;padding:14px 44px 14px 44px;background:#FFFFFF;color:#0A0A0A;border:3px solid #0A0A0A;border-radius:12px;box-shadow:4px 4px 0 #0A0A0A;font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;outline:none;transition:all 0.15s}
.search-input:focus{background:#FFF9B0;transform:translate(-2px,-2px);box-shadow:6px 6px 0 #0A0A0A}
.search-input::placeholder{color:#9A9A9A;font-weight:500}
.search-icon{position:absolute;left:14px;font-size:16px;pointer-events:none}
.search-clear{position:absolute;right:10px;background:#0A0A0A;color:#FFE600;border:0;width:28px;height:28px;border-radius:8px;font-weight:800;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:14px}
.search-clear.show{display:flex}

/* Section */
.section{padding:0 16px;margin-top:16px}
.section-title{font-family:'Archivo Black',sans-serif;font-size:14px;margin:0 0 10px;text-transform:uppercase;letter-spacing:0.5px}
.section-title::before{content:'— ';color:#FF7FE5}

/* Top Fitur */
.top-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.top-item{background:#FFFFFF;border:3px solid #0A0A0A;border-radius:10px;box-shadow:3px 3px 0 #0A0A0A;padding:10px 14px;display:flex;align-items:center;gap:12px;text-decoration:none;color:#0A0A0A;transition:transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1),box-shadow 0.15s ease}
.top-item:active{transform:scale(0.97) translate(2px, 2px);box-shadow:1px 1px 0 #0A0A0A}
.top-rank{font-family:'Archivo Black',sans-serif;font-size:18px;background:#FF7FE5;border:2px solid #0A0A0A;border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.top-name{font-weight:700;font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Chips */
.chips-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chips-row::-webkit-scrollbar{display:none}
.chip{background:#FFFFFF;color:#0A0A0A;border:3px solid #0A0A0A;border-radius:10px;box-shadow:2px 2px 0 #0A0A0A;padding:6px 12px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;transition:all 0.15s;font-family:inherit}
.chip:active{transform:scale(0.94) translate(2px, 2px);box-shadow:0 0 0 #0A0A0A}
.chip.active{background:#0A0A0A;color:#FFE600}

/* Tool List */
.tool-list{display:flex;flex-direction:column;gap:10px}
.tool-card{background:#FFFFFF;border:3px solid #0A0A0A;border-radius:12px;box-shadow:4px 4px 0 #0A0A0A;padding:12px 14px;text-decoration:none;color:#0A0A0A;display:flex;align-items:center;gap:10px;transition:transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1),box-shadow 0.15s ease}
.tool-card:active{transform:scale(0.98) translate(2px, 2px);box-shadow:2px 2px 0 #0A0A0A}
.tool-body{flex:1;min-width:0}
.tool-head{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.tool-name{font-family:'Archivo Black',sans-serif;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-badge{background:#00E5E5;border:2px solid #0A0A0A;border-radius:6px;padding:2px 6px;font-size:10px;font-weight:700;flex-shrink:0;text-transform:uppercase}
.tool-desc{font-size:11px;color:#4A4A4A;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tool-arrow{font-size:18px;font-weight:800;flex-shrink:0}

/* Empty */
.empty{text-align:center;padding:40px 16px;color:#4A4A4A;font-weight:600}
.empty-icon{font-size:40px;margin-bottom:8px}

/* Loading */
.loading{text-align:center;padding:20px;font-weight:700;color:#4A4A4A;font-size:12px}
</style>
<script src="/theme-loader.js"></script>
<link rel="stylesheet" href="/theme-global.css?v=1">
<link rel="stylesheet" href="/ui-ios.css?v=1">
</head>
<body>

<div class="search-header">
  <div class="search-title">CARI TOOL</div>
  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" class="search-input" placeholder="Cari tool atau endpoint..." autocomplete="off" inputmode="search">
    <button type="button" class="search-clear" id="searchClear">✕</button>
  </div>
</div>

<!-- TOP FITUR -->
<div class="section">
  <div class="section-title">Top Fitur</div>
  <div id="topList" class="top-list">
    <div class="loading">Memuat...</div>
  </div>
</div>

<!-- FILTER CHIPS -->
<div class="section">
  <div class="section-title">Kategori</div>
  <div id="chipsRow" class="chips-row"></div>
</div>

<!-- LIST TOOL -->
<div class="section">
  <div class="section-title">Semua Tool</div>
  <div id="toolList" class="tool-list">
    <div class="loading">Memuat...</div>
  </div>
</div>

<script>
(function(){
  var state = {
    allTools: [],
    filteredTools: [],
    topFitur: [],
    activeFolder: 'all',
    query: ''
  };

  var ICONS = {
    home: '<svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 10v10h14V10"/></svg>',
    search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>',
    settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
    inbox: '<svg viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>',
    profil: '<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'
  };

  function esc(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // ==== Load semua tool ====
  function loadTools() {
    fetch('/endpoints.json')
      .then(function(r){ return r.json(); })
      .then(function(data){
        state.allTools = data;
        renderChips(data);
        renderTools(data);
      })
      .catch(function(){
        var el = document.getElementById('toolList');
        if (el) el.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>Gagal memuat</div>';
      });
  }

  // ==== Load top fitur ====
  function loadTopFitur() {
    fetch('/api/stats', { credentials: 'same-origin', cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(j){
        var el = document.getElementById('topList');
        if (!el) return;
        if (j && j.ok && j.top_fitur && j.top_fitur.length > 0) {
          el.innerHTML = j.top_fitur.map(function(t, i){
            return '<a class="top-item" href="/tool.html?id=' + esc(t.catalogId) + '">' +
              '<div class="top-rank">' + (i+1) + '</div>' +
              '<div class="top-name">' + esc(t.name) + '</div>' +
              '<div class="tool-arrow">›</div>' +
              '</a>';
          }).join('');
        } else {
          el.innerHTML = '<div class="loading">Belum ada data hits</div>';
        }
      })
      .catch(function(){
        var el = document.getElementById('topList');
        if (el) el.innerHTML = '<div class="loading">Belum ada data</div>';
      });
  }

  // ==== Render chips ====
  function renderChips(tools) {
    var folders = new Set();
    tools.forEach(function(t){ if (t.folder) folders.add(t.folder); });
    var arr = Array.from(folders).sort();

    var chips = '<button type="button" class="chip active" data-folder="all">Semua</button>';
    arr.forEach(function(f){
      chips += '<button type="button" class="chip" data-folder="' + esc(f) + '">' + esc(f) + '</button>';
    });

    var row = document.getElementById('chipsRow');
    if (!row) return;
    row.innerHTML = chips;

    row.querySelectorAll('.chip').forEach(function(el){
      el.onclick = function(){
        row.querySelectorAll('.chip').forEach(function(x){ x.classList.remove('active'); });
        el.classList.add('active');
        state.activeFolder = el.dataset.folder;
        filterAndRender();
      };
    });
  }

  // ==== Render tools ====
  function renderTools(tools) {
    var el = document.getElementById('toolList');
    if (!el) return;

    if (!tools || tools.length === 0) {
      el.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div>Nggak ada tool yang cocok</div>';
      return;
    }

    el.innerHTML = tools.map(function(t){
      return '<a class="tool-card" href="/tool.html?id=' + esc(t.catalogId) + '">' +
        '<div class="tool-body">' +
          '<div class="tool-head">' +
            '<div class="tool-name">' + esc(t.name || '-') + '</div>' +
            (t.folder ? '<div class="tool-badge">' + esc(t.folder) + '</div>' : '') +
          '</div>' +
          '<div class="tool-desc">' + esc(t.desc || 'Tap untuk pakai tool ini') + '</div>' +
        '</div>' +
        '<div class="tool-arrow">›</div>' +
        '</a>';
    }).join('');
  }

  // ==== Filter + search ====
  function filterAndRender() {
    var q = (state.query || '').toLowerCase().trim();
    var folder = state.activeFolder;

    var result = state.allTools.filter(function(t){
      if (folder !== 'all' && t.folder !== folder) return false;
      if (!q) return true;

      var name = (t.name || '').toLowerCase();
      var desc = (t.desc || '').toLowerCase();
      var cat = (t.catalogId || '').toLowerCase();

      return name.indexOf(q) !== -1 || desc.indexOf(q) !== -1 || cat.indexOf(q) !== -1;
    });

    renderTools(result);
  }

  // ==== Init ====
  function init() {
    loadTools();
    loadTopFitur();

    var input = document.getElementById('searchInput');
    var clearBtn = document.getElementById('searchClear');

    if (input) {
      input.addEventListener('input', function(){
        state.query = input.value;
        if (clearBtn) {
          if (input.value) clearBtn.classList.add('show');
          else clearBtn.classList.remove('show');
        }
        filterAndRender();
      });
    }

    if (clearBtn) {
      clearBtn.onclick = function(){
        if (input) input.value = '';
        state.query = '';
        clearBtn.classList.remove('show');
        filterAndRender();
        if (input) input.focus();
      };
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

<script src="/bottom-nav.js?v=3"></script>

</body>
</html>
