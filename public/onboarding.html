<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<title>Set Profil — Javin Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme-global.css?v=1">
<link rel="stylesheet" href="/onboarding.css?v=1">
<script src="/theme-loader.js"></script>
</head>
<body>

<div class="ob-wrap">
  <header class="ob-header">
    <div class="ob-logo">J</div>
    <h1 class="ob-title">Selamat Datang!</h1>
    <p class="ob-sub">Sebelum mulai, isi dulu profil kamu</p>
  </header>

  <form class="ob-form" id="obForm" autocomplete="off">
    <div class="ob-avatar-wrap">
      <div class="ob-avatar" id="avatarPreview">
        <span id="avatarInitial">U</span>
      </div>
      <label class="ob-avatar-btn" for="avatarInput">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        <span id="avatarLabel">Pilih Foto (opsional)</span>
      </label>
      <input type="file" id="avatarInput" accept="image/*" hidden>
    </div>

    <div class="ob-field">
      <label class="ob-label" for="nameInput">
        Nama Tampilan <span class="ob-required">*</span>
      </label>
      <input type="text" id="nameInput" class="ob-input" placeholder="Contoh: Budi Santoso" maxlength="40" required>
      <div class="ob-hint">Nama ini yang dilihat user lain</div>
    </div>

    <div class="ob-field">
      <label class="ob-label" for="bioInput">Bio (opsional)</label>
      <textarea id="bioInput" class="ob-input ob-textarea" placeholder="Ceritakan sedikit tentang kamu..." maxlength="200" rows="3"></textarea>
      <div class="ob-hint"><span id="bioCount">0</span>/200 karakter</div>
    </div>

    <div class="ob-error" id="obError" hidden></div>

    <button type="submit" class="ob-btn-primary" id="btnSubmit">
      Simpan &amp; Mulai
    </button>
  </form>

  <div class="ob-footer">
    Profil bisa diubah kapan saja dari halaman Profil
  </div>
</div>

<script src="/onboarding.js?v=1"></script>
</body>
</html>
