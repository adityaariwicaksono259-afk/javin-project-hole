<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Inbox — VinAPIay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style-v4.css">
<link rel="stylesheet" href="/native-v7.css">
<style>
.ib-wrap{max-width:640px;margin:0 auto;padding:20px 14px 80px}
.ib-hero{text-align:center;padding:16px 0 24px}
.ib-hero-icon{font-size:52px;margin-bottom:8px}
.ib-hero-title{font-size:22px;font-weight:800;color:#0f172a;letter-spacing:-.5px;margin-bottom:6px}
.ib-hero-sub{font-size:13px;color:#64748b;line-height:1.6}

.ib-tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.ib-tab{padding:8px 14px;border-radius:999px;border:1px solid rgba(148,163,184,.2);background:#fff;color:#64748b;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.2s}
.ib-tab.active{background:#0f172a;color:#fff;border-color:#0f172a}
.ib-tab small{opacity:.6}

.ib-list{display:flex;flex-direction:column;gap:10px}

.ib-card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;transition:.2s;cursor:pointer}
.ib-card:hover{border-color:#0EA5E9;box-shadow:0 8px 24px rgba(14,165,233,.08)}
.ib-card.open{border-color:#0EA5E9}

.ib-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.ib-type{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.ib-type-icon{font-size:22px;flex-shrink:0}
.ib-type-title{font-size:14px;font-weight:700;color:#0f172a;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib-id{font-size:10px;color:#94a3b8;font-family:monospace;font-weight:700;margin-top:2px}
.ib-status{font-size:10px;font-weight:800;padding:4px 10px;border-radius:8px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.ib-status.open{background:#fef3c7;color:#92400e}
.ib-status.replied{background:#dcfce7;color:#166534}
.ib-status.closed{background:#f1f5f9;color:#64748b}

.ib-message{font-size:13px;color:#475569;line-height:1.6;padding:10px 12px;background:#f8fafc;border-radius:10px;white-space:pre-wrap;word-break:break-word;margin-bottom:8px}
.ib-message.reply{background:linear-gradient(135deg,rgba(14,165,233,.08),rgba(99,102,241,.08));border-left:3px solid #0EA5E9;color:#0f172a}
.ib-label{font-size:10px;font-weight:800;color:#0EA5E9;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.ib-date{font-size:11px;color:#94a3b8;text-align:right}

.ib-reply-box{margin-top:10px;padding-top:10px;border-top:1px dashed #e2e8f0;display:none}
.ib-card.open .ib-reply-box{display:block}

.ib-empty{text-align:center;padding:60px 20px;color:#94a3b8}
.ib-empty-icon{font-size:56px;opacity:.5;margin-bottom:12px}
.ib-empty-title{font-size:15px;font-weight:700;color:#64748b;margin-bottom:6px}
.ib-empty-sub{font-size:12px;margin-bottom:20px}
.ib-empty a{display:inline-block;padding:12px 24px;background:linear-gradient(135deg,#0EA5E9,#6366F1);color:#fff;text-decoration:none;border-radius:12px;font-weight:700;font-size:13px;box-shadow:0 4px 14px rgba(14,165,233,.3)}

.ib-load{text-align:center;padding:50px 20px;color:#94a3b8;font-size:13px}

.ib-reply-btn{display:inline-block;margin-top:8px;padding:8px 14px;background:linear-gradient(135deg,#0EA5E9,#6366F1);color:#fff;text-decoration:none;border-radius:10px;font-size:12px;font-weight:700;box-shadow:0 4px 14px rgba(14,165,233,.25)}

body.theme-dark .ib-hero-title{color:#f1f5f9}
body.theme-dark .ib-card{background:rgba(30,41,59,.8);border-color:rgba(255,255,255,.08)}
body.theme-dark .ib-type-title{color:#f1f5f9}
body.theme-dark .ib-message{background:rgba(15,23,42,.5);color:#cbd5e1}
body.theme-dark .ib-tab{background:rgba(30,41,59,.8);border-color:rgba(255,255,255,.08);color:#94a3b8}
body.theme-dark .ib-tab.active{background:#f1f5f9;color:#0f172a;border-color:#f1f5f9}
</style>
<script src="/theme-loader.js"></script>
<link rel="stylesheet" href="/native-feel.css?v=1">
</head>
<body>

<header style="position:sticky;top:0;z-index:50;padding:10px 14px;background:rgba(255,255,255,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(148,163,184,0.15)">
  <div style="display:flex;align-items:center;gap:8px;width:100%">
    <a href="/settings" style="width:44px;height:44px;border-radius:14px;background:#fff;border:1px solid rgba(148,163,184,0.15);display:flex;align-items:center;justify-content:center;font-size:18px;text-decoration:none;color:#0f172a">←</a>
    <h1 style="flex:1;font-size:17px;font-weight:800;margin:0;padding-left:8px">Inbox</h1>
    <button onclick="loadTickets()" style="padding:8px 14px;background:#fff;border:1px solid rgba(148,163,184,0.15);border-radius:12px;font-size:12px;font-weight:700;color:#0f172a;cursor:pointer;font-family:inherit">🔄</button>
  </div>
</header>

<div class="ib-wrap">
  <div class="ib-hero">
    <div class="ib-hero-icon">📬</div>
    <div class="ib-hero-title">Inbox Support</div>
    <div class="ib-hero-sub">Lihat pesan yang udah kamu kirim + balasan dari admin.</div>
  </div>

  <div class="ib-tabs">
    <button class="ib-tab active" data-filter="all">Semua</button>
    <button class="ib-tab" data-filter="open">⏳ Menunggu</button>
    <button class="ib-tab" data-filter="replied">✅ Dibalas</button>
  </div>

  <div id="ibList" class="ib-list">
    <div class="ib-load">Memuat...</div>
  </div>
</div>

<script src="/inbox.js?v=1"></script>
<script src="/update-banner.js?v=1" defer></script>
</body>
</html>
