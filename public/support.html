<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Support — JVaPii</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#06111f;color:#e0f2fe;font-family:'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh}
body{padding:0}
a{color:#22d3ee;text-decoration:none}

.sp-header{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;
  background:rgba(10,25,41,.85);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(34,211,238,.15);
}
.sp-back{
  padding:8px 14px;background:rgba(34,211,238,.1);
  border:1px solid rgba(34,211,238,.25);
  border-radius:10px;color:#22d3ee;
  font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
}
.sp-title{
  flex:1;text-align:center;
  font-family:'Orbitron',sans-serif;
  font-size:14px;font-weight:700;color:#fbbf24;
  letter-spacing:.5px;
}

.sp-wrap{max-width:560px;margin:0 auto;padding:18px 14px 100px}

.sp-hero{text-align:center;padding:14px 0 20px}
.sp-hero-icon{font-size:48px;margin-bottom:8px}
.sp-hero-title{
  font-family:'Orbitron',sans-serif;
  font-size:20px;font-weight:700;color:#fbbf24;letter-spacing:-.3px;margin-bottom:6px;
  text-shadow:0 0 20px rgba(245,158,11,.4);
}
.sp-hero-sub{font-size:13px;color:#94a3b8;line-height:1.6}

.sp-card{
  background:rgba(10,25,41,.88);
  border:1px solid rgba(34,211,238,.15);
  border-radius:18px;padding:20px;margin-bottom:14px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.sp-label{display:block;font-size:13px;font-weight:700;color:#e0f2fe;margin-bottom:10px}
.sp-label small{color:#64748b;font-weight:500;font-size:11px;margin-left:4px}

/* Kategori */
.sp-type-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:18px}
.sp-type{
  padding:14px 8px;border-radius:14px;
  border:2px solid rgba(34,211,238,.15);
  background:rgba(0,0,0,.2);text-align:center;cursor:pointer;
  transition:.2s;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.sp-type:hover{border-color:rgba(34,211,238,.5);transform:translateY(-1px)}
.sp-type.active{
  border-color:#f59e0b;
  background:linear-gradient(135deg,rgba(245,158,11,.1),rgba(217,119,6,.08));
  box-shadow:0 8px 20px rgba(245,158,11,.15);
}
.sp-type-icon{font-size:26px}
.sp-type-name{font-size:12px;font-weight:700;color:#e0f2fe}
.sp-type-desc{font-size:10px;color:#94a3b8}

/* Input */
.sp-input, .sp-textarea{
  width:100%;padding:12px 14px;
  background:rgba(0,0,0,.3);
  border:1.5px solid rgba(34,211,238,.2);
  border-radius:12px;color:#e0f2fe;
  font-family:inherit;font-size:14px;
  outline:none;transition:.2s;margin-bottom:14px;
}
.sp-input:focus, .sp-textarea:focus{border-color:#22d3ee;box-shadow:0 0 0 3px rgba(34,211,238,.1)}
.sp-textarea{min-height:120px;resize:vertical;line-height:1.6}
.sp-input::placeholder, .sp-textarea::placeholder{color:#475569}

.sp-counter{text-align:right;font-size:11px;color:#64748b;margin-top:-10px;margin-bottom:14px;font-family:monospace}
.sp-counter.warn{color:#fbbf24}
.sp-counter.err{color:#f87171}

/* Button */
.sp-submit{
  width:100%;padding:14px;border:0;
  background:linear-gradient(135deg,#f59e0b,#d97706);
  color:#06111f;font-size:14px;font-weight:800;
  border-radius:12px;cursor:pointer;font-family:inherit;
  letter-spacing:.5px;
  box-shadow:0 4px 20px rgba(245,158,11,.3);
  transition:.2s;
}
.sp-submit:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(245,158,11,.4)}
.sp-submit:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* Chat view (auto-reply) */
.sp-chat{display:none}
.sp-chat.show{display:block}
.sp-bubble{
  padding:10px 14px;border-radius:14px;margin-bottom:10px;
  font-size:13px;line-height:1.5;
  animation:bubbleIn .4s ease;
  word-break:break-word;
}
@keyframes bubbleIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.sp-bubble.user{
  background:linear-gradient(135deg,rgba(34,211,238,.15),rgba(14,165,233,.1));
  border:1px solid rgba(34,211,238,.3);
  margin-left:40px;
}
.sp-bubble.bot{
  background:rgba(245,158,11,.08);
  border:1px solid rgba(245,158,11,.25);
  margin-right:40px;
}
.sp-bubble-label{
  font-size:10px;text-transform:uppercase;letter-spacing:.5px;
  font-weight:700;margin-bottom:4px;opacity:.8;
}
.sp-bubble.user .sp-bubble-label{color:#22d3ee}
.sp-bubble.bot .sp-bubble-label{color:#fbbf24}

.sp-new-btn{
  width:100%;padding:12px;margin-top:10px;
  background:rgba(34,211,238,.08);
  border:1px solid rgba(34,211,238,.3);
  color:#22d3ee;font-size:13px;font-weight:600;
  border-radius:12px;cursor:pointer;font-family:inherit;
  transition:.2s;
}
.sp-new-btn:hover{background:rgba(34,211,238,.15)}

/* History */
.sp-hist-title{
  font-family:'Orbitron',sans-serif;
  font-size:12px;font-weight:700;color:#fbbf24;
  letter-spacing:.5px;margin-bottom:10px;text-transform:uppercase;
}
.sp-ticket{
  background:rgba(0,0,0,.25);
  border:1px solid rgba(34,211,238,.12);
  border-radius:12px;padding:12px 14px;margin-bottom:10px;
  cursor:pointer;transition:.2s;
}
.sp-ticket:hover{border-color:rgba(34,211,238,.4)}
.sp-ticket-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.sp-ticket-id{font-family:monospace;font-size:11px;color:#f59e0b;font-weight:700}
.sp-ticket-badge{font-size:10px;padding:2px 8px;border-radius:6px;font-weight:600}
.sp-ticket-badge.bug{background:rgba(239,68,68,.15);color:#f87171}
.sp-ticket-badge.error{background:rgba(251,146,60,.15);color:#fb923c}
.sp-ticket-badge.saran{background:rgba(34,197,94,.15);color:#4ade80}
.sp-ticket-badge.pembelian{background:rgba(168,85,247,.15);color:#c084fc}
.sp-ticket-title{font-size:13px;font-weight:600;color:#e0f2fe;line-height:1.4;margin-bottom:4px}
.sp-ticket-preview{font-size:11px;color:#64748b;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sp-ticket-date{font-size:10px;color:#475569;margin-top:4px;font-family:monospace}

.sp-loading{text-align:center;padding:20px;color:#22d3ee;font-size:13px}
.sp-empty{text-align:center;padding:20px;color:#64748b;font-size:12px}
</style>
<script src="/theme-loader.js"></script>
<link rel="stylesheet" href="/theme-global.css?v=1">
<link rel="stylesheet" href="/ui-ios.css?v=1">
</head>
<body>

<div class="sp-header">
  <button class="sp-back" onclick="location.href='/'">← Kembali</button>
  <div class="sp-title">SUPPORT CENTER</div>
</div>

<div class="sp-wrap">

  <div class="sp-hero">
    <div class="sp-hero-icon">💬</div>
    <div class="sp-hero-title">Pusat Bantuan</div>
  </div>

  <!-- FORM VIEW -->
  <div id="spForm">
    <div class="sp-card">
      <label class="sp-label">Pilih Kategori</label>
      <div class="sp-type-row">
        <button class="sp-type" data-type="bug">
          <div class="sp-type-icon">🐛</div>
          <div class="sp-type-name">Bug</div>
          <div class="sp-type-desc">Aplikasi error</div>
        </button>
        <button class="sp-type" data-type="error">
          <div class="sp-type-icon">⚠️</div>
          <div class="sp-type-name">Error</div>
          <div class="sp-type-desc">Fitur gagal</div>
        </button>
        <button class="sp-type" data-type="saran">
          <div class="sp-type-icon">💡</div>
          <div class="sp-type-name">Saran</div>
          <div class="sp-type-desc">Ide fitur baru</div>
        </button>
        <button class="sp-type" data-type="pembelian">
          <div class="sp-type-icon">💰</div>
          <div class="sp-type-name">Pembelian</div>
          <div class="sp-type-desc">Masalah order</div>
        </button>
      </div>

      <label class="sp-label">Judul <small>(opsional)</small></label>
      <input type="text" id="spTitle" class="sp-input" placeholder="Ringkasan singkat..." maxlength="150">

      <label class="sp-label">Kontak <small>(opsional)</small></label>
      <input type="text" id="spContact" class="sp-input" placeholder="Email / WhatsApp" maxlength="100">

      <label class="sp-label">Pesan <small>(wajib, min 5 karakter)</small></label>
      <textarea id="spMessage" class="sp-textarea" placeholder="Jelaskan detail masalah atau saran Anda..." maxlength="3000"></textarea>
      <div class="sp-counter" id="spCount">0 / 3000</div>

      <button class="sp-submit" id="spSubmit" disabled>🚀 Kirim Laporan</button>
    </div>

  </div>

  <!-- CHAT VIEW (setelah submit) -->
  <div class="sp-chat" id="spChat">
    <div class="sp-card">
      <div class="sp-hist-title">✅ Laporan Terkirim</div>
      <div class="sp-bubble user">
        <div class="sp-bubble-label">Anda</div>
        <div id="spChatUserMsg"></div>
      </div>
      <div class="sp-bubble bot">
        <div class="sp-bubble-label" id="spChatBotTitle">Bot JVaPii</div>
        <div id="spChatBotMsg"></div>
      </div>
      <button class="sp-new-btn" onclick="location.reload()">➕ Buat Laporan Baru</button>
    </div>
  </div>

</div>

<script src="/support.js"></script>
<script src="/back-handler.js?v=1"></script>
<script src="/icons.js?v=1"></script>
</body>
</html>
